name: Publish Official Release Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish'
        required: true
        default: 'v1.0.7'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and cryptographically verify official v1.0.7 binaries & updater artifacts
        run: |
          mkdir -p dist
          cd dist
          FILES=(
            "YIVPN_1.0.7_x64.msi"
            "YIVPN_1.0.7_x64_portable.zip"
            "YIVPN_1.0.7_universal.dmg"
            "YIVPN-Android-1.0.7-arm64-v8a.apk"
          )
          for f in "${FILES[@]}"; do
            echo "Downloading $f ..."
            curl -fL --retry 3 -o "$f" "https://yivpn.net/downloads/$f"
            curl -fL --retry 3 -o "$f.sha256" "https://yivpn.net/downloads/$f.sha256"
          done
          curl -fL --retry 3 -o "YIVPN_1.0.7_x64.msi.sig" "https://yivpn.net/downloads/YIVPN_1.0.7_x64.msi.sig"
          curl -fL --retry 3 -o "latest.json" "https://yivpn.net/downloads/latest.json"
          echo "99a88f7388fa28ada174bdc69b8919d1fd2d99d03e3d8f51565597a0d019ea86  YIVPN_1.0.7_x64.msi" | sha256sum -c -
          echo "79f1f6269cc481c70ff87c993e23d5f3f99400eda4c5713e8229084d51b5fd61  YIVPN_1.0.7_x64_portable.zip" | sha256sum -c -
          echo "d0f6e1ef25f4d64676f45ef40373fa6af6f8fdac0aebe36af98acf0b27464ac6  YIVPN_1.0.7_universal.dmg" | sha256sum -c -
          echo "f226dad3b04dafe6097196283dacb9d013abb247421375dbe666e27a619fd4f2  YIVPN-Android-1.0.7-arm64-v8a.apk" | sha256sum -c -
          ls -lh

      - name: Create Release Notes
        run: |
          cat << 'EOF' > release-notes.md
          ## YIVPN v1.0.7 — Official 20-Language Multi-Platform Release

          Official zero-logs VPN client built on `sing-box 1.14.3` (`Hysteria2`, `VLESS+REALITY`, & `AnyTLS`) with **90 minutes of free daily protection** (no sign-up or card required), **20 native auto-detected languages** (including Arabic & Persian RTL layout), signed Windows MSI in-app updates, and an opt-in **Local MCP Server** (`127.0.0.1:38419/mcp` + `stdio` bridge) for Claude Code, OpenAI Codex, and Cursor.

          ### Checksums (SHA-256)

          | Platform | Package | Size | SHA-256 |
          | :--- | :--- | :--- | :--- |
          | **Windows 10 / 11 (x64)** | `YIVPN_1.0.7_x64.msi` | 30.75 MiB | `99a88f7388fa28ada174bdc69b8919d1fd2d99d03e3d8f51565597a0d019ea86` |
          | **Windows Portable (x64)** | `YIVPN_1.0.7_x64_portable.zip` | 30.30 MiB | `79f1f6269cc481c70ff87c993e23d5f3f99400eda4c5713e8229084d51b5fd61` |
          | **macOS 11+ Universal** | `YIVPN_1.0.7_universal.dmg` | 66.18 MiB | `d0f6e1ef25f4d64676f45ef40373fa6af6f8fdac0aebe36af98acf0b27464ac6` |
          | **Android 7.0+ (ARM64)** | `YIVPN-Android-1.0.7-arm64-v8a.apk` | 87.09 MiB | `f226dad3b04dafe6097196283dacb9d013abb247421375dbe666e27a619fd4f2` |

          - **Official Website (20 Languages)**: [https://yivpn.net/en/](https://yivpn.net/en/)
          - **Download & Verification Guide**: [https://yivpn.net/en/download/](https://yivpn.net/en/download/)
          - **Unified AI & VPN API / MCP Hub**: [https://yivpn.net/en/vpn-api/](https://yivpn.net/en/vpn-api/) · [yivpn-agent-cli](https://github.com/yivpn-official/yivpn-agent-cli)
          EOF

      - name: Publish GitHub Release as github-actions[bot]
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "YIVPN $TAG (Windows, macOS & Android · 20 Languages)" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/* --title "YIVPN $TAG (Windows, macOS & Android · 20 Languages)" --notes-file release-notes.md --latest
          fi
