name: Publish Official Release Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish'
        required: true
        default: 'v1.0.8'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and cryptographically verify official v1.0.8 binaries & updater artifacts
        run: |
          mkdir -p dist
          cd dist
          FILES=(
            "YIVPN_1.0.8_x64.msi"
            "YIVPN_1.0.8_x64_portable.zip"
            "YIVPN_1.0.8_universal.dmg"
            "YIVPN-Android-1.0.8-arm64-v8a.apk"
          )
          for f in "${FILES[@]}"; do
            echo "Downloading $f ..."
            curl -fL --retry 3 -o "$f" "https://yivpn.net/downloads/$f"
            sha256sum "$f" > "$f.sha256"
          done
          curl -fL --retry 3 -o "YIVPN_1.0.8_x64.msi.sig" "https://yivpn.net/downloads/YIVPN_1.0.8_x64.msi.sig"
          curl -fL --retry 3 -o "latest.json" "https://yivpn.net/downloads/latest.json"
          echo "768225f8080e98de884b583335b6c2413e9db46479bcf69d33607667a4288d4e  YIVPN_1.0.8_x64.msi" | sha256sum -c -
          echo "f4f53c76d38bea17623b7a8fecb574275a595ebedd1e44578d97084b9a42da51  YIVPN_1.0.8_x64_portable.zip" | sha256sum -c -
          echo "6eedffa696ae3db65b9a49ec3066a026c4f1dea9bb9f2d3e7d59f8e174c3e9c7  YIVPN_1.0.8_universal.dmg" | sha256sum -c -
          echo "a4c8f44ee75e50a352ca986e743dbbc0e6aae6d4f02a7c03792cf334401048fb  YIVPN-Android-1.0.8-arm64-v8a.apk" | sha256sum -c -
          ls -lh

      - name: Create Release Notes
        run: |
          cat << 'EOF' > release-notes.md
          ## YIVPN v1.0.8 — Official 20-Language Multi-Platform Release

          Official zero-logs VPN client built on `sing-box 1.14.3` (`Hysteria2`, `VLESS+REALITY`, & `AnyTLS`) with **90 minutes of free daily protection** (no sign-up or card required), **20 native auto-detected languages** (including Arabic & Persian RTL layout), signed Windows MSI in-app updates, and an opt-in **Local MCP Server** (`127.0.0.1:38419/mcp` + `stdio` bridge) for Claude Code, OpenAI Codex, and Cursor.

          ### Checksums (SHA-256)

          | Platform | Package | Size | SHA-256 |
          | :--- | :--- | :--- | :--- |
          | **Windows 10 / 11 (x64)** | `YIVPN_1.0.8_x64.msi` | 30.78 MiB | `768225f8080e98de884b583335b6c2413e9db46479bcf69d33607667a4288d4e` |
          | **Windows Portable (x64)** | `YIVPN_1.0.8_x64_portable.zip` | 30.33 MiB | `f4f53c76d38bea17623b7a8fecb574275a595ebedd1e44578d97084b9a42da51` |
          | **macOS 11+ Universal** | `YIVPN_1.0.8_universal.dmg` | 66.24 MiB | `6eedffa696ae3db65b9a49ec3066a026c4f1dea9bb9f2d3e7d59f8e174c3e9c7` |
          | **Android 7.0+ (ARM64)** | `YIVPN-Android-1.0.8-arm64-v8a.apk` | 94.30 MiB | `a4c8f44ee75e50a352ca986e743dbbc0e6aae6d4f02a7c03792cf334401048fb` |

          - **Official Website (20 Languages)**: [https://yivpn.net/en/](https://yivpn.net/en/)
          - **Download & Verification Guide**: [https://yivpn.net/en/download/](https://yivpn.net/en/download/)
          - **Unified AI & VPN API / MCP Hub**: [https://yivpn.net/en/vpn-api/](https://yivpn.net/en/vpn-api/) · [yivpn-agent-cli](https://github.com/yivpn-official/yivpn-agent-cli)
          EOF

      - name: Publish GitHub Release as github-actions[bot]
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release delete-asset "$TAG" "YIVPN-Android-1.0.7-arm64-v8a.apk" -y || true
            gh release delete-asset "$TAG" "YIVPN-Android-1.0.7-arm64-v8a.apk.sha256" -y || true
            gh release edit "$TAG" --title "YIVPN $TAG (Windows, macOS & Android · 20 Languages)" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/* --title "YIVPN $TAG (Windows, macOS & Android · 20 Languages)" --notes-file release-notes.md --latest
          fi
