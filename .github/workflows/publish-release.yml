name: Publish Official Release Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish'
        required: true
        default: 'v1.0.6'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and cryptographically verify official v1.0.6 binaries & updater artifacts
        run: |
          mkdir -p dist
          cd dist
          FILES=(
            "YIVPN_1.0.6_x64.msi"
            "YIVPN_1.0.6_x64_portable.zip"
            "YIVPN_1.0.6_universal.dmg"
            "YIVPN-Android-1.0.6-arm64-v8a.apk"
          )
          for f in "${FILES[@]}"; do
            echo "Downloading $f ..."
            curl -fL --retry 3 -o "$f" "https://yivpn.net/downloads/$f"
            curl -fL --retry 3 -o "$f.sha256" "https://yivpn.net/downloads/$f.sha256"
          done
          curl -fL --retry 3 -o "YIVPN_1.0.6_x64.msi.sig" "https://yivpn.net/downloads/YIVPN_1.0.6_x64.msi.sig"
          curl -fL --retry 3 -o "latest.json" "https://yivpn.net/downloads/latest.json"
          echo "ce6c2781e48dc68a905822f863891c9ea8b0fd7cd42ca535f623f3a52fdb9386  YIVPN_1.0.6_x64.msi" | sha256sum -c -
          echo "315ed29c681fccadf728106fd0d25e571607ceb018307aba6f62f2ec244e3f98  YIVPN_1.0.6_x64_portable.zip" | sha256sum -c -
          echo "609a76e98e300f3cacd58ff477b80e54ab32d875474d899ee707f305caf2633e  YIVPN_1.0.6_universal.dmg" | sha256sum -c -
          echo "1e001bd8c72b41ec8eb2c848da9351aca3b9cd134f1b2b34bb0b6807d47f2662  YIVPN-Android-1.0.6-arm64-v8a.apk" | sha256sum -c -
          ls -lh

      - name: Create Release Notes
        run: |
          cat << 'EOF' > release-notes.md
          ## YIVPN v1.0.6 — Official 20-Language Multi-Platform Release

          Official zero-logs VPN client built on `sing-box 1.14.3` (`Hysteria2`, `VLESS+REALITY`, & `AnyTLS`) with **90 minutes of free daily protection** (no sign-up or card required), **20 native auto-detected languages** (including Arabic & Persian RTL layout), signed Windows MSI in-app updates, and an opt-in **Local MCP Server** (`127.0.0.1:38419/mcp` + `stdio` bridge) for Claude Code, OpenAI Codex, and Cursor.

          ### Checksums (SHA-256)

          | Platform | Package | Size | SHA-256 |
          | :--- | :--- | :--- | :--- |
          | **Windows 10 / 11 (x64)** | `YIVPN_1.0.6_x64.msi` | 30.75 MiB | `ce6c2781e48dc68a905822f863891c9ea8b0fd7cd42ca535f623f3a52fdb9386` |
          | **Windows Portable (x64)** | `YIVPN_1.0.6_x64_portable.zip` | 30.30 MiB | `315ed29c681fccadf728106fd0d25e571607ceb018307aba6f62f2ec244e3f98` |
          | **macOS 11+ Universal** | `YIVPN_1.0.6_universal.dmg` | 66.18 MiB | `609a76e98e300f3cacd58ff477b80e54ab32d875474d899ee707f305caf2633e` |
          | **Android 7.0+ (ARM64)** | `YIVPN-Android-1.0.6-arm64-v8a.apk` | 87.09 MiB | `1e001bd8c72b41ec8eb2c848da9351aca3b9cd134f1b2b34bb0b6807d47f2662` |

          - **Official Website (20 Languages)**: [https://yivpn.net/en/](https://yivpn.net/en/)
          - **Download & Verification Guide**: [https://yivpn.net/en/download/](https://yivpn.net/en/download/)
          - **Unified AI & VPN API / MCP Hub**: [https://yivpn.net/en/vpn-api/](https://yivpn.net/en/vpn-api/) · [yivpn-agent-cli](https://github.com/yivpn-official/yivpn-agent-cli)
          EOF

      - name: Publish GitHub Release as github-actions[bot]
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "YIVPN $TAG (Windows, macOS & Android · 20 Languages)" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/* --title "YIVPN $TAG (Windows, macOS & Android · 20 Languages)" --notes-file release-notes.md --latest
          fi
